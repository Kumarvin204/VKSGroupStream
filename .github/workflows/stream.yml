name: 24/7 Universal YouTube Playlist & Video Live Streamer

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key'
        required: true
        type: string
        default: 'vg5h-m29m-mgwc-y0am-72vb'
      playlist_or_video_url:
        description: '🔗 YouTube Playlist Ya Video Link'
        required: false
        type: string
        default: 'https://youtube.com/playlist?list=PLZ1WJQx0GoFA'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg (2 Seconds)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Setup YT-DLP (1 Second)
        run: |
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Prepare Playlist & Videos
        run: |
          mkdir -p videos
          URL=$(echo "${{ github.event.inputs.playlist_or_video_url }}" | tr -d '\r\n\t ')
          
          if [ -n "$URL" ]; then
            echo "=========================================="
            echo "🔥 DOWNLOADING PLAYLIST (Creator Bypass): $URL"
            echo "=========================================="
            
            yt-dlp \
              --extractor-args "youtube:player_client=android_creator,android" \
              --ignore-errors \
              --no-warnings \
              -f "best[ext=mp4]/best" \
              --yes-playlist \
              --max-downloads 50 \
              -o "videos/%(playlist_index)03d_%(id)s.%(ext)s" \
              "$URL" || true
          fi
          
          # If no URL was provided, use repository video
          if [ -z "$URL" ] && [ -z "$(ls -A videos 2>/dev/null)" ]; then
            echo "No URL provided, using repo video..."
            if [ -f "ganesh.mp4" ]; then
              cp ganesh.mp4 videos/001_ganesh.mp4
            fi
          fi
          
          # Build sorted playlist file
          > playlist.txt
          for f in $(ls -1 videos/* 2>/dev/null | sort); do
            if [ -f "$f" ]; then
              echo "✅ Video in Queue: $f"
              echo "file '$PWD/$f'" >> playlist.txt
            fi
          done
          
          echo "=========================================="
          echo "🎉 TOTAL READY VIDEOS IN QUEUE:"
          cat playlist.txt
          echo "=========================================="
          
          if [ ! -s playlist.txt ]; then
            echo "❌ Error: No videos found to stream!"
            exit 1
          fi

      - name: Start 24/7 Live Stream Loop
        run: |
          KEY=$(echo "${{ github.event.inputs.stream_key }}" | tr -d '\r\n\t ')
          
          echo "=========================================="
          echo "Starting 24/7 Non-Stop Broadcast to YouTube..."
          echo "=========================================="
          
          while true; do
            while IFS= read -r line || [ -n "$line" ]; do
              VID_PATH=$(echo "$line" | sed -e "s/^file '//" -e "s/'$//")
              if [ -f "$VID_PATH" ]; then
                echo "🔴 NOW LIVE STREAMING: $VID_PATH"
                ffmpeg -re -i "$VID_PATH" \
                  -vf "format=yuv420p,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(1920-iw)/2:(1080-ih)/2:black" \
                  -c:v libx264 -preset superfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
                  -pix_fmt yuv420p -g 60 -keyint_min 60 \
                  -c:a aac -b:a 128k -ar 44100 \
                  -flvflags no_duration_filesize \
                  -f flv "rtmps://a.rtmps.youtube.com/live2/$KEY" || sleep 1
              fi
            done < playlist.txt
            echo "🔁 Playlist reached end. Seamlessly restarting from first video..."
            sleep 1
          done
