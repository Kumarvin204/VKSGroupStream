name: 24/7 YouTube Live Stream Loop

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: 'Apni YouTube Stream Key Yahan Paste Karein'
        required: true
        default: 'v1mc-x3hv-h54q-bt61-247v'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Start 24/7 Live Stream Loop
        run: |
          KEY="${{ github.event.inputs.stream_key }}"
          while true; do
            ffmpeg -re -i ganesh.mp4 \
              -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
              -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
              -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY" || sleep 1
          done
