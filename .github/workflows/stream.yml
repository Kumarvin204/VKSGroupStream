name: 24/7 Multi-Channel Live Streamer

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key'
        required: true
        type: string
        default: 'vg5h-m29m-mgwc-y0am-72vb'
      video_name:
        description: '📹 Video File Name'
        required: false
        default: 'df.mp4'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Fetch Video from Release Storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO="${{ github.event.inputs.video_name }}"
          if [ -z "$VIDEO" ]; then VIDEO="df.mp4"; fi
          
          if [ ! -f "$VIDEO" ]; then
            echo "Downloading $VIDEO from GitHub Release storage..."
            gh release download v1.0 -p "$VIDEO" --repo ${{ github.repository }} || true
          fi
          
          echo "FINAL_VIDEO=$VIDEO" >> $GITHUB_ENV

      - name: Start 24/7 Live Stream Loop
        run: |
          KEY=$(echo "${{ github.event.inputs.stream_key }}" | tr -d '\r\n\t ')
          VIDEO="${{ env.FINAL_VIDEO }}"
          
          while true; do
            ffmpeg -re -i "$VIDEO" \
              -vf "format=yuv420p,scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black" \
              -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2800k -bufsize 5000k \
              -pix_fmt yuv420p -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -flvflags no_duration_filesize \
              -f flv "rtmps://a.rtmps.youtube.com/live2/$KEY" || sleep 2
          done
