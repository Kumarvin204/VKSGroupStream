name: 24/7 Multi-Stream Safe Auto-Stop Relay & Scheduler

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key (हर लाइव की अपनी की डालें)'
        required: true
        type: string
        default: 'bqgr-fqwk-0mdc-e0fm-5pxk'
      video_name:
        description: '📹 Video File Name in Releases v1.0 (e.g. ek_hi_names_hyam.mp4)'
        required: false
        type: string
        default: 'ek_hi_names_hyam.mp4'
      duration:
        description: '⏱️ Target Duration (11h = 2 Legs Relay Marathon, 5.5h = Single Leg)'
        required: true
        type: choice
        options:
          - '11h'
          - '5.5h'
        default: '11h'
      delay_minutes:
        description: '⏳ Quick Start Delay (in Minutes, 0 = Start Now, Max 20 min)'
        required: false
        type: string
        default: '0'
      relay_part:
        description: '🔄 Relay Part (1 = First 5.5h Leg, 2 = Second 5.5h Leg [Internal])'
        required: false
        type: string
        default: '1'

concurrency:
  group: stream-${{ github.event.inputs.stream_key || 'default' }}-${{ github.event.inputs.relay_part || '1' }}
  cancel-in-progress: false

permissions: write-all

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Fetch Video File from GitHub Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO="${{ github.event.inputs.video_name }}"
          if [ -z "$VIDEO" ]; then
            VIDEO="seth_karamsi_khatu_shyam_1hr_movie.mp4"
          fi
          
          echo "Target Video: $VIDEO"
          
          if [ ! -f "$VIDEO" ]; then
            echo "Downloading $VIDEO from GitHub Release v1.0 storage..."
            gh release download v1.0 -p "$VIDEO" --repo ${{ github.repository }} || true
          fi
          
          if [ ! -f "$VIDEO" ]; then
            VIDEO=$(ls *.mp4 2>/dev/null | head -n 1)
          fi
          
          echo "FINAL_VIDEO=$VIDEO" >> $GITHUB_ENV
          ls -lh "$VIDEO"

      - name: Schedule Delay Wait
        run: |
          PART="${{ github.event.inputs.relay_part }}"
          if [ "$PART" != "2" ]; then
            DELAY="${{ github.event.inputs.delay_minutes }}"
            DELAY=$(echo "$DELAY" | tr -cd '0-9')
            if [ -z "$DELAY" ]; then DELAY=0; fi
            
            # 🛑 CRITICAL SAFETY GUARD: GitHub Actions kills ANY runner after 360 minutes (6 hours).
            # Live streaming needs 320 minutes (5h 20m). 360 - 320 = 40 minutes maximum buffer.
            # If delay > 20 minutes, sleeping inside runner causes GitHub to kill the runner!
            if [ "$DELAY" -gt 20 ]; then
              echo "⚠️ [TIMEOUT SAFETY ALERT]: You requested a delay of $DELAY minutes."
              echo "GitHub Actions has a HARD 6-hour (360-minute) maximum job limit."
              echo "Since streaming needs 5 Hours 20 Mins (320m), sleeping $DELAY minutes would cause GitHub to KILL the stream!"
              echo "Capping in-runner delay to safe maximum of 15 minutes."
              DELAY=15
            fi
            
            if [ "$DELAY" -gt 0 ]; then
              echo "=========================================================================="
              echo "⏳ [SCHEDULED DELAY ACTIVE] Waiting $DELAY minute(s) before starting live stream..."
              echo "Delay started at: $(date)"
              echo "=========================================================================="
              sleep $(( DELAY * 60 ))
              echo "=========================================================================="
              echo "✅ Scheduled delay completed! Launching stream now at $(date)!"
              echo "=========================================================================="
            else
              echo "⚡ No schedule delay specified (0m). Starting live stream immediately!"
            fi
          else
            echo "🔄 Part 2 (Hot-Handshake Relay) detected — skipping start delay to ensure zero-gap!"
          fi

      - name: Run Safe Live Stream (Looping Non-Stop for Target Duration)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY="${{ github.event.inputs.stream_key }}"
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          fi
          if [ -z "$KEY" ]; then
            KEY="bqgr-fqwk-0mdc-e0fm-5pxk"
          fi
          
          KEY=$(echo "$KEY" | tr -d '\r\n\t ')
          VIDEO="${{ env.FINAL_VIDEO }}"
          PART="${{ github.event.inputs.relay_part }}"
          if [ -z "$PART" ]; then
            PART="1"
          fi
          
          DURATION="${{ github.event.inputs.duration }}"
          if [ -z "$DURATION" ]; then
            DURATION="11h"
          fi
          
          # Exact 5 Hours 20 Mins = 19,200 seconds per leg (Leaves 40 mins safety buffer before GitHub 6h ceiling)
          # Leg 1 (5h 20m) + Leg 2 (5h 20m) = ~10 Hours 40 Mins (Perfect Safe 11-Hour YouTube Stream)
          PART_DURATION=19200
          
          echo "=========================================================================="
          echo "🚀 YOUTUBE LIVE STREAMING ENGINE (SAFE AUTO-STOP PROTOCOL)"
          echo "Target Duration Setting: $DURATION"
          if [ "$DURATION" = "5.5h" ]; then
            echo "Stream Mode: Single Leg (5.5 Hours Auto-Stop)"
          else
            echo "Stream Mode: 2-Leg Full Marathon (11 Hours Relay with Zero-Gap Hot Handshake)"
          fi
          echo "Current Leg: Part $PART"
          echo "Leg Duration: 5 Hours 20 Minutes ($PART_DURATION seconds)"
          echo "Streaming Video: $VIDEO (Loop Mode: Continuous Non-Stop -stream_loop -1)"
          echo "=========================================================================="
          
          END_TIME=$(( $(date +%s) + PART_DURATION ))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 0 ]; then
              break
            fi
            
            ffmpeg -re -stream_loop -1 -i "$VIDEO" \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -flvflags no_duration_filesize -flush_packets 1 \
              -t $REMAINING \
              "rtmp://a.rtmp.youtube.com/live2/$KEY" || \
            ffmpeg -re -stream_loop -1 -i "$VIDEO" \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -flvflags no_duration_filesize -flush_packets 1 \
              -t $REMAINING \
              "rtmps://a.rtmps.youtube.com/live2/$KEY" || sleep 2
          done
          
          if [ "$PART" -eq 1 ]; then
            if [ "$DURATION" = "5.5h" ]; then
              echo "=========================================================================="
              echo "🎉 5.5-HOUR LIVE STREAM COMPLETED SUCCESSFULLY!"
              echo "🛑 Cleanly auto-stopped as configured (Single Leg 5h 20m)."
              echo "=========================================================================="
            else
              echo "=========================================================================="
              echo "⚡ Part 1 (5h 20m) Completed Cleanly! Triggering Part 2 Relay Marathon..."
              echo "=========================================================================="
              gh workflow run stream.yml -f stream_key="$KEY" -f video_name="$VIDEO" -f relay_part="2" -f duration="11h" -f delay_minutes="0" --repo ${{ github.repository }} || true
              echo "✅ Part 2 Relay successfully dispatched to GitHub Actions!"
            fi
          else
            echo "=========================================================================="
            echo "🎉 FULL 11 HOURS OF LIVE STREAMING COMPLETED SUCCESSFULLY!"
            echo "🛑 Auto-stopping now to ensure clean YouTube 1080p video archival & indexing!"
            echo "=========================================================================="
          fi
