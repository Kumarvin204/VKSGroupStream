name: 24/7 Multi-Stream Collision-Free Auto-Relay

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key (हर लाइव की अपनी की डालें)'
        required: true
        type: string
        default: 'vg5h-m29m-mgwc-y0am-72vb'
      video_name:
        description: '📹 Video File Name in Releases v1.0 (e.g. df.mp4 or ep6_khatushyam.mp4)'
        required: false
        type: string
        default: 'ep6_khatushyam.mp4'

concurrency:
  group: stream-${{ github.event.inputs.stream_key || 'default' }}
  cancel-in-progress: true

permissions: write-all

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Fetch Video File from GitHub Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO="${{ github.event.inputs.video_name }}"
          if [ -z "$VIDEO" ]; then
            VIDEO="ep6_khatushyam.mp4"
          fi
          
          echo "Target Video: $VIDEO"
          
          if [ ! -f "$VIDEO" ]; then
            echo "Downloading $VIDEO from GitHub Release v1.0 storage..."
            gh release download v1.0 -p "$VIDEO" --repo ${{ github.repository }} || true
          fi
          
          if [ ! -f "$VIDEO" ]; then
            VIDEO=$(ls *.mp4 2>/dev/null | head -n 1)
          fi
          
          echo "FINAL_VIDEO=$VIDEO" >> $GITHUB_ENV
          ls -lh "$VIDEO"

      - name: Run 24/7 Live Stream Relay (5 Hours 45 Mins + Auto-Trigger Next)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY="${{ github.event.inputs.stream_key }}"
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          fi
          if [ -z "$KEY" ]; then
            KEY="vg5h-m29m-mgwc-y0am-72vb"
          fi
          
          KEY=$(echo "$KEY" | tr -d '\r\n\t ')
          VIDEO="${{ env.FINAL_VIDEO }}"
          
          echo "=========================================="
          echo "🚀 24/7 Live Streaming Relay Active (2500kbps CBR, 2s GOP, Zero Latency)..."
          echo "Streaming Video: $VIDEO"
          echo "=========================================="
          
          END_TIME=$(( $(date +%s) + 20700 ))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            ffmpeg -re -stream_loop -1 -i "$VIDEO" \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -b:v 2500k -minrate 2500k -maxrate 2500k -bufsize 5000k \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -flvflags no_duration_filesize \
              -t 20700 \
              "rtmp://a.rtmp.youtube.com/live2/$KEY" || \
            ffmpeg -re -stream_loop -1 -i "$VIDEO" \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -b:v 2500k -minrate 2500k -maxrate 2500k -bufsize 5000k \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -flvflags no_duration_filesize \
              -t 20700 \
              "rtmps://a.rtmps.youtube.com/live2/$KEY" || sleep 2
          done
          
          echo "⚡ Triggering Next Relay Runner..."
          gh workflow run stream.yml -f stream_key="$KEY" -f video_name="$VIDEO" --repo ${{ github.repository }} || true
