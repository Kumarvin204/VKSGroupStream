name: 24/7 Non-Stop Auto-Relay Live Streamer

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key'
        required: true
        type: string
        default: 'vg5h-m29m-mgwc-y0am-72vb'
      video_name:
        description: '📹 Video File Name in Releases v1.0 (e.g. df.mp4)'
        required: false
        type: string
        default: 'df.mp4'

  schedule:
    - cron: '0 */5 * * *'  # हर 5 घंटे में ऑटोमैटिक फ्रेश रनर चालू करेगा

permissions: write-all

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Fetch Video File from GitHub Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO="${{ github.event.inputs.video_name }}"
          if [ -z "$VIDEO" ]; then
            VIDEO="df.mp4"
          fi
          
          echo "Target Video: $VIDEO"
          
          # Download from Release v1.0 storage if not in repo
          if [ ! -f "$VIDEO" ]; then
            echo "Downloading $VIDEO from GitHub Release v1.0 storage..."
            gh release download v1.0 -p "$VIDEO" --repo ${{ github.repository }} || true
          fi
          
          if [ ! -f "$VIDEO" ]; then
            VIDEO=$(ls *.mp4 2>/dev/null | head -n 1)
          fi
          
          echo "FINAL_VIDEO=$VIDEO" >> $GITHUB_ENV
          ls -lh "$VIDEO"

      - name: Run 24/7 Live Stream Relay (5 Hours 45 Mins + Auto-Trigger Next)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY="${{ github.event.inputs.stream_key }}"
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          fi
          if [ -z "$KEY" ]; then
            KEY="vg5h-m29m-mgwc-y0am-72vb"
          fi
          
          KEY=$(echo "$KEY" | tr -d '\r\n\t ')
          VIDEO="${{ env.FINAL_VIDEO }}"
          
          echo "=========================================="
          echo "🚀 24/7 Live Streaming Relay Active..."
          echo "Streaming Video: $VIDEO"
          echo "=========================================="
          
          # 5 घंटे 45 मिनट तक लगातार स्ट्रीम चलाएगा
          END_TIME=$(( $(date +%s) + 20700 ))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            ffmpeg -re -i "$VIDEO" \
              -vf "format=yuv420p,scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(1280-iw)/2:(720-ih)/2:black" \
              -c:v libx264 -preset veryfast -b:v 2200k -maxrate 2600k -bufsize 5000k \
              -pix_fmt yuv420p -g 40 -keyint_min 20 \
              -c:a aac -b:a 128k -ar 44100 \
              -flvflags no_duration_filesize \
              -f flv "rtmps://a.rtmps.youtube.com/live2/$KEY" || sleep 2
          done
          
          echo "⚡ Triggering Next Relay Runner to keep stream 24/7 Non-Stop..."
          gh workflow run stream.yml -f stream_key="$KEY" -f video_name="$VIDEO" --repo ${{ github.repository }} || true
          echo "✅ Next Relay Run Dispatched Successfully!"
