name: 24/7 YouTube Live Stream Loop

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Google Drive ya Direct Video Link (Optional agar repo me video nahi hai)'
        required: false
        default: ''
  schedule:
    - cron: '0 */6 * * *' # Auto-restarts every 6 hours

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg yt-dlp curl

      - name: Get Video File
        run: |
          if [ -n "${{ github.event.inputs.video_url }}" ]; then
            echo "Downloading video from link..."
            yt-dlp -o "stream_video.mp4" "${{ github.event.inputs.video_url }}" || curl -L "${{ github.event.inputs.video_url }}" -o "stream_video.mp4"
          elif [ -f *.mp4 ]; then
            echo "Using uploaded video from repo..."
            cp $(ls *.mp4 | head -n 1) stream_video.mp4
          else
            echo "No video found! Please upload a video to repo or provide a link."
            exit 1
          fi

      - name: Start 24/7 Live Stream Loop to YouTube
        run: |
          ffmpeg -re -stream_loop -1 -i stream_video.mp4 \
            -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}"
