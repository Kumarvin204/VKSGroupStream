name: 24/7 Multi-Stream Safe Auto-Stop Relay & Scheduler

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key (हर लाइव की अपनी की डालें)'
        required: true
        type: string
        default: 'bqgr-fqwk-0mdc-e0fm-5pxk'
      video_name:
        description: '📹 Video File Name in Releases v1.0 (e.g. need_mai_shyam_ata_hai.mp4)'
        required: false
        type: string
        default: 'need_mai_shyam_ata_hai.mp4'
      duration:
        description: '⏱️ Live Stream Duration (कितने घंटे चलानी है: 1 से 11 घंटे)'
        required: true
        type: choice
        options:
          - '1h'
          - '2h'
          - '3h'
          - '4h'
          - '5h'
          - '6h'
          - '7h'
          - '8h'
          - '9h'
          - '10h'
          - '11h'
        default: '4h'
      delay_minutes:
        description: '⏳ Quick Start Delay (in Minutes, 0 = Start Now, Max 20 min)'
        required: false
        type: string
        default: '0'
      relay_part:
        description: '🔄 Relay Part (1 = First Leg, 2 = Second Leg [Internal])'
        required: false
        type: string
        default: '1'

concurrency:
  group: stream-${{ github.event.inputs.stream_key || 'default' }}-${{ github.event.inputs.relay_part || '1' }}
  cancel-in-progress: false

permissions: write-all

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Fetch Video File from GitHub Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO="${{ github.event.inputs.video_name }}"
          if [ -z "$VIDEO" ]; then
            VIDEO="need_mai_shyam_ata_hai.mp4"
          fi
          
          echo "Target Video: $VIDEO"
          
          if [ ! -f "$VIDEO" ]; then
            echo "Downloading $VIDEO from GitHub Release v1.0 storage..."
            gh release download v1.0 -p "$VIDEO" --repo ${{ github.repository }} || true
          fi
          
          if [ ! -f "$VIDEO" ]; then
            VIDEO=$(ls *.mp4 2>/dev/null | head -n 1)
          fi
          
          echo "FINAL_VIDEO=$VIDEO" >> $GITHUB_ENV
          ls -lh "$VIDEO"

      - name: Schedule Delay Wait
        run: |
          PART="${{ github.event.inputs.relay_part }}"
          if [ "$PART" != "2" ]; then
            DELAY="${{ github.event.inputs.delay_minutes }}"
            DELAY=$(echo "$DELAY" | tr -cd '0-9')
            if [ -z "$DELAY" ]; then DELAY=0; fi
            
            # 🛑 CRITICAL SAFETY GUARD: GitHub Actions kills ANY runner after 360 minutes (6 hours).
            if [ "$DELAY" -gt 20 ]; then
              echo "⚠️ [TIMEOUT SAFETY ALERT]: You requested a delay of $DELAY minutes."
              echo "GitHub Actions has a HARD 6-hour (360-minute) maximum job limit."
              echo "Capping in-runner delay to safe maximum of 15 minutes."
              DELAY=15
            fi
            
            if [ "$DELAY" -gt 0 ]; then
              echo "=========================================================================="
              echo "⏳ [SCHEDULED DELAY ACTIVE] Waiting $DELAY minute(s) before starting live stream..."
              echo "Delay started at: $(date)"
              echo "=========================================================================="
              sleep $(( DELAY * 60 ))
              echo "=========================================================================="
              echo "✅ Scheduled delay completed! Launching stream now at $(date)!"
              echo "=========================================================================="
            else
              echo "⚡ No schedule delay specified (0m). Starting live stream immediately!"
            fi
          else
            echo "🔄 Part 2 (Hot-Handshake Relay) detected — skipping start delay to ensure zero-gap!"
          fi

      - name: Run Safe Live Stream (Looping Non-Stop for Target Duration)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY="${{ github.event.inputs.stream_key }}"
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          fi
          if [ -z "$KEY" ]; then
            KEY="bqgr-fqwk-0mdc-e0fm-5pxk"
          fi
          
          KEY=$(echo "$KEY" | tr -d '\r\n\t ')
          VIDEO="${{ env.FINAL_VIDEO }}"
          PART="${{ github.event.inputs.relay_part }}"
          if [ -z "$PART" ]; then
            PART="1"
          fi
          
          DURATION="${{ github.event.inputs.duration }}"
          if [ -z "$DURATION" ]; then
            DURATION="4h"
          fi
          
          # Extract numeric hours (e.g., '1h' -> 1, '10h' -> 10, '5.5h' -> 5.5)
          HOURS_NUM=$(echo "$DURATION" | sed 's/[^0-9.]//g')
          if [ -z "$HOURS_NUM" ]; then
            HOURS_NUM=4
          fi

          TOTAL_SECONDS=$(awk -v h="$HOURS_NUM" 'BEGIN { printf "%.0f", h * 3600 }')
          
          echo "=========================================================================="
          echo "🚀 YOUTUBE LIVE STREAMING ENGINE (FLEXIBLE DURATION SELECTOR)"
          echo "Requested Duration: $DURATION ($HOURS_NUM Hours / $TOTAL_SECONDS seconds)"

          # Check if single leg (<= 5.5 hours) or multi-leg relay (> 5.5 hours)
          if awk -v h="$HOURS_NUM" 'BEGIN { exit !(h <= 5.5) }'; then
            IS_RELAY=0
            PART_DURATION=$TOTAL_SECONDS
            echo "Stream Mode: Single Leg (Runs continuously for $HOURS_NUM Hours, Auto-Stops cleanly)"
          else
            IS_RELAY=1
            PART_DURATION=$(( TOTAL_SECONDS / 2 ))
            HOURS_PER_LEG=$(awk -v s="$PART_DURATION" 'BEGIN { printf "%.2f", s / 3600 }')
            echo "Stream Mode: 2-Leg Seamless Relay ($HOURS_NUM Hours Total | Leg $PART Duration: $HOURS_PER_LEG Hours / $PART_DURATION seconds)"
          fi
          
          echo "Current Leg: Part $PART"
          echo "Streaming Video: $VIDEO (Loop Mode: Continuous Non-Stop -stream_loop -1)"
          echo "=========================================================================="
          
          # Select Ingest Server based on Relay Part:
          # Part 1 uses YouTube Primary Server
          # Part 2 uses YouTube Redundant Backup Server (with ?backup=1)
          if [ "$PART" -eq 2 ]; then
            DEST_RTMP="rtmp://b.rtmp.youtube.com/live2?backup=1/$KEY"
            DEST_RTMPS="rtmps://b.rtmps.youtube.com/live2?backup=1/$KEY"
            echo "📡 Ingest Target: YouTube BACKUP Redundant Server ($DEST_RTMP)"
          else
            DEST_RTMP="rtmp://a.rtmp.youtube.com/live2/$KEY"
            DEST_RTMPS="rtmps://a.rtmps.youtube.com/live2/$KEY"
            echo "📡 Ingest Target: YouTube PRIMARY Server ($DEST_RTMP)"
          fi
          
          # 🚀 ZERO-SECOND RELAY HANDOVER PROTOCOL (10-Minute Advance Dispatch)
          # Triggers Part 2 ONLY if this is a Multi-Leg stream (duration > 5.5 hours)
          if [ "$PART" -eq 1 ] && [ "$IS_RELAY" -eq 1 ]; then
            (
              TRIGGER_DELAY=$(( PART_DURATION - 600 ))
              if [ $TRIGGER_DELAY -gt 0 ]; then
                sleep $TRIGGER_DELAY
                echo "=========================================================================="
                echo "⚡ [ZERO-DELAY HANDSHAKE] Dispatching Part 2 exactly 10 minutes in advance!"
                echo "Part 2 will stream to YouTube Backup Server for seamless 0-second failover..."
                echo "=========================================================================="
                gh workflow run stream.yml -f stream_key="$KEY" -f video_name="$VIDEO" -f relay_part="2" -f duration="$DURATION" -f delay_minutes="0" --repo ${{ github.repository }} || true
                echo "✅ Part 2 Backup Relay dispatched successfully!"
              fi
            ) &
          fi
          
          END_TIME=$(( $(date +%s) + PART_DURATION ))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 0 ]; then
              break
            fi
            
            ffmpeg -re -stream_loop -1 -i "$VIDEO" \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -flvflags no_duration_filesize -flush_packets 1 \
              -t $REMAINING \
              "$DEST_RTMP" || \
            ffmpeg -re -stream_loop -1 -i "$VIDEO" \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -flvflags no_duration_filesize -flush_packets 1 \
              -t $REMAINING \
              "$DEST_RTMPS" || sleep 2
          done
          
          if [ "$PART" -eq 1 ]; then
            if [ "$IS_RELAY" -eq 0 ]; then
              echo "=========================================================================="
              echo "🎉 $DURATION LIVE STREAM COMPLETED SUCCESSFULLY!"
              echo "🛑 Cleanly auto-stopped as configured ($HOURS_NUM Hours Single Leg)."
              echo "=========================================================================="
            else
              echo "=========================================================================="
              echo "⚡ Part 1 ($HOURS_PER_LEG Hours) Completed Cleanly! Part 2 Backup Stream is already LIVE on YouTube!"
              echo "=========================================================================="
            fi
          else
            echo "=========================================================================="
            echo "🎉 FULL $DURATION LIVE STREAM MARATHON COMPLETED SUCCESSFULLY!"
            echo "🛑 Auto-stopping now to ensure clean YouTube video archival & indexing!"
            echo "=========================================================================="
          fi
