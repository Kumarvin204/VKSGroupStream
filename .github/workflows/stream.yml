name: 24/7 Multi-Stream 11-Hour Safe Auto-Stop Relay

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key (हर लाइव की अपनी की डालें)'
        required: true
        type: string
        default: 'bqgr-fqwk-0mdc-e0fm-5pxk'
      video_name:
        description: '📹 Video File Name in Releases v1.0 (e.g. seth_karamsi_khatu_shyam_1hr_movie.mp4)'
        required: false
        type: string
        default: 'seth_karamsi_khatu_shyam_1hr_movie.mp4'
      relay_part:
        description: '🔄 Relay Part (1 = First 5.5h Leg, 2 = Second 5.5h Leg [Auto-Stops at 11h])'
        required: false
        type: string
        default: '1'

concurrency:
  group: stream-${{ github.event.inputs.stream_key || 'default' }}-${{ github.event.inputs.relay_part || '1' }}
  cancel-in-progress: false

permissions: write-all

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Fetch Video File from GitHub Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO="${{ github.event.inputs.video_name }}"
          if [ -z "$VIDEO" ]; then
            VIDEO="seth_karamsi_khatu_shyam_1hr_movie.mp4"
          fi
          
          echo "Target Video: $VIDEO"
          
          if [ ! -f "$VIDEO" ]; then
            echo "Downloading $VIDEO from GitHub Release v1.0 storage..."
            gh release download v1.0 -p "$VIDEO" --repo ${{ github.repository }} || true
          fi
          
          if [ ! -f "$VIDEO" ]; then
            VIDEO=$(ls *.mp4 2>/dev/null | head -n 1)
          fi
          
          echo "FINAL_VIDEO=$VIDEO" >> $GITHUB_ENV
          ls -lh "$VIDEO"

      - name: Run Safe Live Stream (5 Hours 20 Mins x 2 Legs = Exactly 11 Hours, then Auto-Stop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY="${{ github.event.inputs.stream_key }}"
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.YOUTUBE_STREAM_KEY }}"
          fi
          if [ -z "$KEY" ]; then
            KEY="bqgr-fqwk-0mdc-e0fm-5pxk"
          fi
          
          KEY=$(echo "$KEY" | tr -d '\r\n\t ')
          VIDEO="${{ env.FINAL_VIDEO }}"
          PART="${{ github.event.inputs.relay_part }}"
          if [ -z "$PART" ]; then
            PART="1"
          fi
          
          # Exact 5 Hours 20 Mins = 19,200 seconds per leg (Leaves 40 mins safety buffer before GitHub 6h ceiling)
          # Leg 1 (5h 20m) + Leg 2 (5h 20m) = ~10 Hours 45 Mins (Perfect Safe 11-Hour YouTube Stream)
          PART_DURATION=19200
          
          echo "=========================================================================="
          echo "🚀 11-HOUR SAFE YOUTUBE LIVE STREAMING PROTOCOL"
          echo "Current Leg: Part $PART of 2"
          echo "Leg Duration: 5 Hours 20 Minutes ($PART_DURATION seconds)"
          echo "Streaming Video: $VIDEO"
          echo "=========================================================================="
          
          END_TIME=$(( $(date +%s) + PART_DURATION ))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 0 ]; then
              break
            fi
            
            ffmpeg -re -stream_loop -1 -i "$VIDEO" \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -flvflags no_duration_filesize -flush_packets 1 \
              -t $REMAINING \
              "rtmp://a.rtmp.youtube.com/live2/$KEY" || \
            ffmpeg -re -stream_loop -1 -i "$VIDEO" \
              -c:v libx264 -preset ultrafast -tune zerolatency \
              -b:v 3000k -maxrate 3500k -bufsize 6000k \
              -pix_fmt yuv420p -r 25 -g 50 -keyint_min 25 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv -flvflags no_duration_filesize -flush_packets 1 \
              -t $REMAINING \
              "rtmps://a.rtmps.youtube.com/live2/$KEY" || sleep 2
          done
          
          if [ "$PART" -eq 1 ]; then
            echo "⚡ Part 1 (5h 20m) Finished Cleanly! Auto-triggering Part 2 for remaining 5h 20m..."
            gh workflow run stream.yml -f stream_key="$KEY" -f video_name="$VIDEO" -f relay_part="2" --repo ${{ github.repository }}
            echo "✅ Part 2 Relay successfully dispatched to GitHub Actions!"
          else
            echo "=========================================================================="
            echo "🎉 FULL 11 HOURS OF LIVE STREAMING COMPLETED SUCCESSFULLY!"
            echo "🛑 Auto-stopping now to ensure clean YouTube 1080p video archival & indexing!"
            echo "=========================================================================="
          fi
