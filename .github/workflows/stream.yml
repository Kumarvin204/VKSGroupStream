name: 24/7 Universal YouTube Playlist & Video Live Streamer

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key (Jis Channel Par Live Jana Ho)'
        required: true
        type: string
        default: 'vg5h-m29m-mgwc-y0am-72vb'
      playlist_or_video_url:
        description: '🔗 YouTube Playlist Ya Video Link (Khali Chhodne Par Repo Video Chalegi)'
        required: false
        type: string
        default: ''

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & YT-DLP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          pip install --upgrade --no-cache-dir yt-dlp

      - name: Prepare Playlist & Videos
        run: |
          mkdir -p videos
          URL=$(echo "${{ github.event.inputs.playlist_or_video_url }}" | xargs)
          
          if [ -n "$URL" ]; then
            echo "=========================================="
            echo "Downloading Playlist/Video (Android Bypass Active): $URL"
            echo "=========================================="
            
            yt-dlp \
              --extractor-args "youtube:player_client=android,web,ios" \
              --ignore-errors \
              --no-warnings \
              -f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best" \
              --merge-output-format mp4 \
              --yes-playlist \
              --max-downloads 50 \
              -o "videos/%(playlist_index)03d_%(title).50s.%(ext)s" \
              "$URL" || yt-dlp --extractor-args "youtube:player_client=android,web,ios" --ignore-errors -f "best[ext=mp4]/best" -o "videos/001_video.mp4" "$URL" || true
          fi
          
          # If no video downloaded from URL, use repository video
          if [ -z "$(ls -A videos 2>/dev/null)" ]; then
            echo "No video downloaded from link, using repository videos..."
            if [ -f "ganesh.mp4" ]; then
              cp ganesh.mp4 videos/001_ganesh.mp4
            else
              for vid in *.mp4; do
                [ -f "$vid" ] && cp "$vid" videos/
              done
            fi
          fi
          
          # Build ordered playlist file
          > playlist.txt
          for f in videos/*; do
            if [ -f "$f" ]; then
              echo "Found Video in Queue: $f"
              echo "file '$PWD/$f'" >> playlist.txt
            fi
          done
          
          echo "=========================================="
          echo "TOTAL READY VIDEOS FOR 24/7 STREAM:"
          cat playlist.txt
          echo "=========================================="

      - name: Start 24/7 Live Stream Loop
        run: |
          KEY=$(echo "${{ github.event.inputs.stream_key }}" | tr -d '\r\n\t ')
          
          echo "=========================================="
          echo "Starting 24/7 Non-Stop Broadcast to YouTube..."
          echo "=========================================="
          
          while true; do
            while IFS= read -r line || [ -n "$line" ]; do
              VID_PATH=$(echo "$line" | sed -e "s/^file '//" -e "s/'$//")
              if [ -f "$VID_PATH" ]; then
                echo "🔴 NOW LIVE STREAMING: $VID_PATH"
                ffmpeg -re -i "$VID_PATH" \
                  -vf "format=yuv420p,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(1920-iw)/2:(1080-ih)/2:black" \
                  -c:v libx264 -preset superfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
                  -pix_fmt yuv420p -g 60 -keyint_min 60 \
                  -c:a aac -b:a 128k -ar 44100 \
                  -flvflags no_duration_filesize \
                  -f flv "rtmps://a.rtmps.youtube.com/live2/$KEY" || sleep 1
              fi
            done < playlist.txt
            echo "🔁 Playlist reached end. Seamlessly restarting from first video..."
            sleep 1
          done
