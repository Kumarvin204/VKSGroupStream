name: 24/7 Universal YouTube Playlist & Video Live Streamer

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: '🔑 YouTube Stream Key'
        required: true
        type: string
        default: 'vg5h-m29m-mgwc-y0am-72vb'
      playlist_or_video_url:
        description: '🔗 YouTube Playlist Ya Video Link'
        required: true
        type: string
        default: 'https://youtube.com/playlist?list=PLZ1WJQx0GoFA'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg (2 Seconds)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Setup YT-DLP (1 Second)
        run: |
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Prepare Playlist & Videos (2-Step Bypass Engine)
        run: |
          mkdir -p videos
          URL=$(echo "${{ github.event.inputs.playlist_or_video_url }}" | tr -d '\r\n\t ')
          
          echo "=========================================="
          echo "🔥 PROCESSING PLAYLIST/VIDEO URL: $URL"
          echo "=========================================="
          
          # Step 1: Extract Video IDs from Playlist URL
          yt-dlp --flat-playlist --print id --no-warnings "$URL" > video_ids.txt 2>/dev/null || true
          
          if [ ! -s video_ids.txt ]; then
            yt-dlp --print id --no-warnings "$URL" > video_ids.txt 2>/dev/null || true
          fi
          
          echo "Found $(wc -l < video_ids.txt) Video IDs in Playlist."
          
          # Step 2: Download each video with TV Embedded / Creator Bypass
          INDEX=1
          while IFS= read -r VID_ID || [ -n "$VID_ID" ]; do
            VID_ID=$(echo "$VID_ID" | tr -d '\r\n\t ')
            if [ -n "$VID_ID" ]; then
              P_NUM=$(printf "%03d" $INDEX)
              echo "⬇️ Downloading Video [$P_NUM]: https://www.youtube.com/watch?v=$VID_ID ..."
              
              yt-dlp \
                --extractor-args "youtube:player_client=tv_embedded,android_creator,android" \
                --no-warnings \
                -f "best[ext=mp4]/best" \
                -o "videos/${P_NUM}_${VID_ID}.mp4" \
                "https://www.youtube.com/watch?v=$VID_ID" || true
              
              INDEX=$((INDEX + 1))
            fi
          done < video_ids.txt
          
          # Step 3: Build ordered playlist.txt for FFmpeg
          > playlist.txt
          for f in $(ls -1 videos/*.mp4 2>/dev/null | sort); do
            if [ -f "$f" ]; then
              echo "✅ Added to Live Queue: $f"
              echo "file '$PWD/$f'" >> playlist.txt
            fi
          done
          
          echo "=========================================="
          echo "🎉 TOTAL VIDEOS IN 24/7 PLAYLIST QUEUE:"
          cat playlist.txt
          echo "=========================================="
          
          if [ ! -s playlist.txt ]; then
            echo "❌ Error: Could not download videos from playlist!"
            exit 1
          fi

      - name: Start 24/7 Live Stream Loop
        run: |
          KEY=$(echo "${{ github.event.inputs.stream_key }}" | tr -d '\r\n\t ')
          
          echo "=========================================="
          echo "Starting 24/7 Non-Stop Broadcast to YouTube..."
          echo "=========================================="
          
          while true; do
            while IFS= read -r line || [ -n "$line" ]; do
              VID_PATH=$(echo "$line" | sed -e "s/^file '//" -e "s/'$//")
              if [ -f "$VID_PATH" ]; then
                echo "🔴 NOW LIVE STREAMING: $VID_PATH"
                ffmpeg -re -i "$VID_PATH" \
                  -vf "format=yuv420p,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(1920-iw)/2:(1080-ih)/2:black" \
                  -c:v libx264 -preset superfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
                  -pix_fmt yuv420p -g 60 -keyint_min 60 \
                  -c:a aac -b:a 128k -ar 44100 \
                  -flvflags no_duration_filesize \
                  -f flv "rtmps://a.rtmps.youtube.com/live2/$KEY" || sleep 1
              fi
            done < playlist.txt
            echo "🔁 All playlist songs finished. Restarting from first video in loop..."
            sleep 1
          done
